openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- description: Generated server url
  url: http://localhost
tags:
- description: "Book, view and cancel service appointments"
  name: Appointments
- description: Bookable start times for a service type
  name: Availability
- description: "Reference data: dealerships and service types"
  name: Catalog
paths:
  /api/v1/appointments:
    post:
      description: "Idempotent per customer and Idempotency-Key: a replay returns\
        \ 200 with the original appointment."
      operationId: book
      parameters:
      - description: "Client-generated key, at most 100 characters"
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookAppointmentRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
          description: Replay of an earlier request with the same Idempotency-Key
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
          description: Appointment created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed request or missing Idempotency-Key
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Customer, vehicle, dealership or service type not found"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No technician or bay available, vehicle already booked, or\
            \ high contention"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Business rule violated (past or unaligned start, outside opening\
            \ hours, vehicle not owned, key reused)"
      summary: Book an appointment
      tags:
      - Appointments
  /api/v1/appointments/{id}:
    get:
      operationId: view
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Appointment not found
      summary: Get an appointment
      tags:
      - Appointments
  /api/v1/appointments/{id}/cancel:
    post:
      description: "Idempotent: cancelling a cancelled appointment returns it unchanged."
      operationId: cancel
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Appointment not found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Appointment has already started
      summary: Cancel an appointment
      tags:
      - Appointments
  /api/v1/customers/{customerId}/appointments:
    get:
      description: Paged; optionally filtered by status.
      operationId: list
      parameters:
      - in: path
        name: customerId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid status, page or size"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Customer not found
      summary: List a customer's appointments
      tags:
      - Appointments
  /api/v1/dealerships:
    get:
      operationId: dealerships
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DealershipResponse"
          description: OK
      summary: List dealerships
      tags:
      - Catalog
  /api/v1/dealerships/{dealershipId}/availability:
    get:
      operationId: daily
      parameters:
      - in: path
        name: dealershipId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: serviceTypeId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: date
        required: true
        schema:
          type: string
          format: date
      responses:
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed date or service type id
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Dealership or service type not found
      summary: Available slots for one day
      tags:
      - Availability
  /api/v1/dealerships/{dealershipId}/availability/weekly:
    get:
      description: weekStart must be a Monday; defaults to the current week.
      operationId: weekly
      parameters:
      - in: path
        name: dealershipId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: serviceTypeId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: weekStart
        required: false
        schema:
          type: string
          format: date
      responses:
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Malformed parameters, or weekStart is not a Monday"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Dealership or service type not found
      summary: Available slots for a week
      tags:
      - Availability
  /api/v1/service-types:
    get:
      operationId: serviceTypes
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceTypeResponse"
          description: OK
      summary: List service types
      tags:
      - Catalog
components:
  schemas:
    AppointmentResponse:
      type: object
      properties:
        cancelledAt:
          type: string
        createdAt:
          type: string
        customer:
          $ref: "#/components/schemas/CustomerRef"
        dealership:
          $ref: "#/components/schemas/DealershipRef"
        endTime:
          type: string
        id:
          type: string
          format: uuid
        serviceBay:
          $ref: "#/components/schemas/ServiceBayRef"
        serviceType:
          $ref: "#/components/schemas/ServiceTypeRef"
        startTime:
          type: string
        status:
          type: string
        technician:
          $ref: "#/components/schemas/TechnicianRef"
        vehicle:
          $ref: "#/components/schemas/VehicleRef"
    BookAppointmentRequest:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        dealershipId:
          type: string
          format: uuid
        serviceTypeId:
          type: string
          format: uuid
        startTime:
          type: string
        vehicleId:
          type: string
          format: uuid
      required:
      - customerId
      - dealershipId
      - serviceTypeId
      - startTime
      - vehicleId
    CustomerRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    DealershipRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    DealershipResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        openingHours:
          type: array
          items:
            $ref: "#/components/schemas/OpeningHoursResponse"
    OpeningHoursResponse:
      type: object
      properties:
        closesAt:
          type: string
        dayOfWeek:
          type: string
        opensAt:
          type: string
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    ServiceBayRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ServiceTypeRef:
      type: object
      properties:
        code:
          type: string
        durationMinutes:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        name:
          type: string
    ServiceTypeResponse:
      type: object
      properties:
        code:
          type: string
        durationMinutes:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        name:
          type: string
    TechnicianRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    VehicleRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        make:
          type: string
        model:
          type: string
        vin:
          type: string
