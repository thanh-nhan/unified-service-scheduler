spring:
  application:
    name: scheduler
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler}
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-components: always
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Trace export is off unless OTEL_TRACING_EXPORT_ENABLED=true (OTLP endpoint via standard OTEL_* variables).
          enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        # Prometheus scraping is the metrics path; OTLP metric push stays off unless enabled.
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
springdoc:
  # Document only the public API; sorted keys keep docs/openapi.yaml diffs stable.
  paths-to-match: /api/v1/**
  writer-with-order-by-keys: true
